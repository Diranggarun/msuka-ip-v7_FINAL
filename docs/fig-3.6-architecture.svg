<rect x="14" y="36" width="1072" height="690" rx="10" fill="#fff" stroke="#888" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="30" y="62.9" text-anchor="start" font-size="14" fill="#666" font-weight="700">CICS Local Area Network — runs fully offline, no internet connection needed</text>
<rect x="70" y="90" width="230" height="130" rx="6" fill="#fff" stroke="#2F5597" stroke-width="1.5"/>
<path d="M70,118 V96 Q70,90 76,90 H294 Q300,90 300,96 V118 Z" fill="#2F5597"/>
<text x="185" y="108.9" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">Student / Faculty device</text>
<text x="82" y="140.375" text-anchor="start" font-size="12.5" fill="#222">Browser: index.html</text>
<text x="82" y="158.375" text-anchor="start" font-size="12.5" fill="#222">Chat, files, voice calls</text>
<text x="82" y="176.375" text-anchor="start" font-size="12.5" fill="#222">Laptop or phone on Wi-Fi</text>
