<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="722" viewBox="0 0 1100 722" font-family="Segoe UI, Arial, sans-serif">
<rect width="1100" height="722" fill="#fff"/>
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
 <marker id="tri" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fff" stroke="#333"/></marker>
 <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.3"/></marker>
</defs>
<text x="550" y="36.3" text-anchor="middle" font-size="18" fill="#2F5597" font-weight="700">Input-Process-Output (IPO) Diagram</text>
<rect x="30" y="58" width="170" height="36" rx="6" fill="#2F5597" stroke="#2F5597" stroke-width="1.5"/>
<text x="115" y="81.25" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">Module</text>
<rect x="230" y="58" width="230" height="36" rx="6" fill="#2F5597" stroke="#2F5597" stroke-width="1.5"/>
<text x="345" y="81.25" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">Input</text>
<rect x="490" y="58" width="280" height="36" rx="6" fill="#2F5597" stroke="#2F5597" stroke-width="1.5"/>
<text x="630" y="81.25" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">Process</text>
